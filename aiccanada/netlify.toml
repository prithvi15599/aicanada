[build]
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/register"
  to = "/.netlify/functions/register"
  status = 200

[[redirects]]
  from = "/api/registration-status"
  to = "/.netlify/functions/registration-status"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
